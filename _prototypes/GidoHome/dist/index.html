<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gido Gido — 主畫面</title>
<meta name="description" content="Gido Gido 可愛派對遊戲主畫面 Prototype">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&family=Outfit:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./src/style.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>

<div id="gs">

  <!-- VERSION BADGE (Top-Right Permanent) -->
  <div id="version-badge" aria-label="版本號">v1.0.97 (a2de285)</div>

  <!-- BACKGROUND DYNAMIC EFFECTS -->
  <div class="bg-halftone"></div>
  <div class="bg-capsules">
    <div class="capsule cap-1"></div>
    <div class="capsule cap-2"></div>
    <div class="capsule cap-3"></div>
    <div class="capsule cap-4"></div>
  </div>

  <!-- THREE.JS CANVAS -->
  <div id="canvas-wrap"></div>

  <!-- CHARACTER LABELS (positioned by JS) -->
  <div class="char-label" id="lbl-avery">Pewpew</div>
  <div class="char-label" id="lbl-xiaocai">Tanku</div>
  <div class="char-label" id="lbl-mina">Slobu</div>
  <div class="char-label" id="lbl-jerry">Rolzo</div>
  <div class="char-label" id="lbl-raddog">Raddog</div>
  <div class="char-label" id="lbl-bomato">Bomato</div>

  <!-- GAMEPAD STATUS TOAST -->
  <div id="gamepad-toast">🎮 手把已連線</div>

  <!-- LEFT NAVIGATION -->
  <nav id="left-panel" aria-label="主選單">
    <button class="menu-btn" id="btn-quick">QUICK PLAY</button>
    <button class="menu-btn" id="btn-custom">CUSTOM GAME</button>
    <button class="menu-btn" id="btn-tut">HOW TO PLAY</button>
    <button class="menu-btn" id="btn-settings">SETTINGS</button>
    <button class="menu-btn" id="btn-quit">QUIT</button>
  </nav>

  <!-- BOTTOM BAR -->
  <footer id="bottom-bar">
    <div id="btm-icons">
      <button class="btm-icon" id="btn-people" title="人類圖鑑" aria-label="開啟人類圖鑑" tabindex="0">👤</button>
      <button class="btm-icon" id="btn-skin" title="角色造型" aria-label="開啟角色造型選擇" tabindex="0">👕</button>
      <button class="btm-icon" id="btn-brush" title="換背景" tabindex="0">🖌️</button>
    </div>
  </footer>

  <!-- HUMAN ENCYCLOPEDIA MODAL (人類圖鑑) -->
  <section id="people-picker" aria-label="人類圖鑑" aria-hidden="true">
    <div id="people-picker-dialog">
      <div id="people-tab-wrap" aria-label="人類圖鑑類別標籤"></div>
      <div id="people-card-wrap" aria-label="人類款式列表"></div>
      <div id="people-picker-footer">
        <div class="people-stats">
          <span>吸收總數 <b id="people-total-absorbed">0人</b></span>
          <span>收集進度 <b id="people-type-stats">0 / 0 款</b></span>
        </div>
        <button id="btn-people-back" type="button">
          <span class="back-label">Back</span>
          <span class="back-badge">Ⓑ</span>
        </button>
      </div>
    </div>
  </section>

  <!-- CHARACTER / SKIN PICKER -->
  <section id="skin-picker" aria-label="角色造型選擇" aria-hidden="true">
    <div class="skin-picker-title">
      <span class="eyebrow">SELECT</span>
      <strong id="customization-menu-title">CHARACTER</strong>
    </div>
    <div id="character-card-wrap" aria-label="角色列表"></div>
    <div id="accessory-card-wrap" aria-label="Accessory 列表"></div>

    <div class="skin-stage-copy" aria-live="polite">
      <span class="eyebrow">NOW STYLING</span>
      <strong id="skin-character-name">Pewpew</strong>
    </div>

    <div id="skin-unlock-message" role="status" aria-live="polite">
      <p id="unlock-message-text">完成100次巨獸對決以解鎖這個Skin</p>
      <div class="skin-unlock-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100">
        <span></span><b id="skin-unlock-percent">0%</b>
      </div>
    </div>

    <button id="btn-accessory" type="button" title="切換至 Accessory 選單">
      <span id="customization-toggle-icon">🎩</span><small id="customization-toggle-label">ACCESSORY</small><b>Y</b>
    </button>

    <div id="skin-tray">
      <button class="skin-cycle-btn" id="btn-skin-prev" type="button" aria-label="上一個 Skin">L</button>
      <div class="skin-options-block">
        <span class="tray-label">SKIN</span>
        <div id="skin-card-wrap" aria-label="Skin 顏色列表"></div>
      </div>
      <button class="skin-cycle-btn" id="btn-skin-next" type="button" aria-label="下一個 Skin">R</button>
    </div>

    <div class="skin-actions">
      <button id="btn-skin-back" type="button">Back <span>Ⓑ</span></button>
    </div>
  </section>

</div>

<!-- BACKGROUND PICKER PANEL (fixed to viewport bottom, outside #gs) -->
<div id="bg-picker" aria-label="背景選擇器">
  <div id="bg-unlock-message" role="status" aria-live="polite">
    <p id="bg-unlock-message-text">在主畫面待滿60分鐘以解鎖這個背景</p>
    <div class="skin-unlock-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100">
      <span id="bg-unlock-progress-fill"></span><b id="bg-unlock-percent">35%</b>
    </div>
  </div>
  <div id="bg-picker-inner">
    <div id="bg-card-wrap"></div>
    <button id="btn-bg-back">
      <span class="back-label">Back</span>
      <span class="back-badge">Ⓑ</span>
    </button>
  </div>
</div>


<script type="module" src="./src/main.js"></script>
</body>
</html>
